<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="sign_up/signup.css">
</head>
<body>
    <img 
    src="images/notepad.png" alt="Decorative image" class="left-image">

    <div class="wrapper">
        <form id="signupForm">
            <h1>Sign Up</h1>

            <div class="input-box">
                <input type="text" id="username" placeholder="Username" required>
            </div>

            <div class="input-box">
                <input type="email" id="email" placeholder="Email" required>
            </div>

            <div class="input-box">
                <input type="password" id="password" placeholder="Password" required>
            </div>

            <div class="input-box">
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
            </div>

            <button type="submit" class="btn">Create Account</button>

            <div class="register-link"><p>Already have an account?<a href="log_in/login.html">Login</a></p>
            </div>

            <p id="message"></p>
        </form>
    </div>

    <script src="sign_up/storage.js"></script>
</body>
</html>
